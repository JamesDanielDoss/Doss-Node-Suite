[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doss-node-suite"
version = "0.6.0"
description = "Custom ComfyUI nodes for practical image, LoRA, workflow timing, and LTX-2.5 motion-control workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "James Doss AI" },
]
keywords = [
    "comfyui",
    "custom-nodes",
    "image-generation",
    "workflow-utilities",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.urls]
Repository = "https://github.com/JamesDanielDoss/Doss-Node-Suite"
Issues = "https://github.com/JamesDanielDoss/Doss-Node-Suite/issues"

[tool.comfy]
PublisherId = "jamesdossai"
DisplayName = "Doss Node Suite"

[tool.setuptools]
packages = ["doss_node_suite", "doss_node_suite.nodes"]
package-dir = { doss_node_suite = "." }
include-package-data = true

[tool.setuptools.package-data]
doss_node_suite = [
    "js/*.js",
    "node_list.json",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
