[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doss-node-suite"
version = "0.7.0"
description = "Doss Hub and 33 practical ComfyUI tools for images, masks, video, audio, prompts, generation, and workflow review."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "James Doss AI" },
]
keywords = [
    "comfyui",
    "custom-nodes",
    "image-generation",
    "workflow-utilities",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["numpy>=1.25", "Pillow>=10.1", "av>=14"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.urls]
Repository = "https://github.com/JamesDanielDoss/Doss-Node-Suite"
Issues = "https://github.com/JamesDanielDoss/Doss-Node-Suite/issues"
Registry = "https://registry.comfy.org/nodes/doss-node-suite"
"Hugging Face" = "https://huggingface.co/jamesdanieldoss"

[tool.comfy]
PublisherId = "jamesdossai"
DisplayName = "Doss Node Suite"

[tool.setuptools]
packages = ["doss_node_suite", "doss_node_suite.nodes", "doss_node_suite.core"]
package-dir = { doss_node_suite = "." }
include-package-data = true

[tool.setuptools.package-data]
doss_node_suite = [
    "js/*.js",
    "js/*.css",
    "catalog.json",
    "node_list.json",
    "examples/*.json",
    "examples/api/*.json",
    "docs/*.md",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
