name: Publish tested release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tested release tag, for example v0.7.0'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: doss-registry-publication
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/check_release.py --tag "$RELEASE_TAG" --publish
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  checks:
    needs: resolve
    uses: ./.github/workflows/checks.yml
    with:
      source_ref: ${{ needs.resolve.outputs.revision }}
  publish:
    needs: [resolve, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install comfy-cli==1.20.0
      - run: python scripts/build_release.py
      - env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: python scripts/publish_registry.py
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 --verify-tag --title "Doss Node Suite $RELEASE_TAG" --notes-file docs/release-0.7.0.md
