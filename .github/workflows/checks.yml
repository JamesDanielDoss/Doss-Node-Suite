name: Checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]' build
      - run: npm install --ignore-scripts --package-lock=false
      - run: npm run build
      - run: git diff --exit-code -- js
      - run: npm test
      - run: python -m pytest -q
      - run: python scripts/check_release.py
      - run: python -m build
      - run: python scripts/build_release.py
      - run: python scripts/check_archive.py
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: git clone --depth 1 --branch v0.35.1 https://github.com/Comfy-Org/ComfyUI.git ../comfy-validation
      - run: python -m pip install -r ../comfy-validation/requirements.txt -r requirements.txt
      - run: python scripts/build_release.py
      - run: python scripts/native_validation.py --comfy-root ../comfy-validation --archive dist/doss-node-suite-0.7.0.zip
